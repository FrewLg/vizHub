<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizHub - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --navy-primary: #0a192f;
            --samsung-green: #007f5f;
            --navy-light: #172a45;
        }
        body {
            background-color: var(--navy-primary);
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-top: 6px solid var(--samsung-green);
        }
        .btn-samsung {
            background-color: var(--samsung-green);
            color: white;
            font-weight: bold;
        }
        .btn-samsung:hover {
            background-color: #005f43;
            color: white;
        }
        .brand-title {
            color: var(--navy-primary);
            font-weight: 800;
        }
        .brand-subtitle {
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="brand-title">Viz<span style="color: var(--samsung-green);">Hub</span></h2>
            <p class="brand-subtitle">Global Burden of Disease Analytics Portal</p>
        </div>

        <div class="d-grid mb-3">
            <a href="{% url 'google_login' %}" class="btn btn-outline-dark btn-md py-2 d-flex align-items-center justify-content-center gap-2 shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-google" viewBox="0 0 16 16">
                  <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.689 7.689 0 0 1 5.352 2.082l-2.284 2.284A4.347 4.347 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.792 4.792 0 0 0 0 3.063c.632 1.896 2.405 3.303 4.492 3.303.955 0 1.838-.28 2.538-.753-.51-.433-.948-.962-1.291-1.573a4.475 4.475 0 0 1-1.247.177 4.316 4.316 0 0 1-4.322-4.322c0-2.385 1.937-4.322 4.322-4.322a4.316 4.316 0 0 1 3.522 1.815l2.04-2.04A7.545 7.545 0 0 0 8 1.15a6.85 6.85 0 0 0-6.85 6.85 6.85 6.85 0 0 0 6.85 6.85c3.553 0 6.136-2.585 6.136-6.136 0-.41-.035-.82-.104-1.22H8v2.44h4.43c-.22 1.163-.895 2.13-1.85 2.766z"/>
                </svg>
                Continue with Google
            </a>
        </div>

        <div class="text-center text-muted my-3 small">
            <span>OR EMAIL LOGIN</span>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Email Address</label>
                <input type="email" name="login" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-samsung py-2">Sign In</button>
            </div>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <small class="text-muted">Don't have an account? <a href="{% url 'account_signup' %}" style="color: var(--samsung-green); text-decoration: none; font-weight: bold;">Create Account</a></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
